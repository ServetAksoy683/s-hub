name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Native (C++) için NDK + CMake, Android 34 platformu
      - name: Android SDK / NDK / CMake kur
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Zip'i aç (iç içe klasör / zip olsa bile settings.gradle'ı bulur)
      - name: Projeyi hazirla
        id: proj
        run: |
          set -e
          find_settings() {
            find "$1" -name settings.gradle -not -path '*/.git/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-
          }
          S=$(find_settings .)
          if [ -z "$S" ]; then
            mkdir -p work
            for z in $(find . -maxdepth 1 -name '*.zip'); do unzip -oq "$z" -d work; done
            for i in 1 2 3; do
              for z in $(find work -name '*.zip'); do unzip -oq "$z" -d "$(dirname "$z")"; done
            done
            S=$(find_settings work)
          fi
          if [ -z "$S" ]; then echo "settings.gradle bulunamadi"; exit 1; fi
          DIR=$(cd "$(dirname "$S")" && pwd)
          echo "Proje klasoru: $DIR"
          if [ -f index.html ]; then
            mkdir -p "$DIR/app/src/main/assets"
            cp index.html "$DIR/app/src/main/assets/index.html"
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: APK derle
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: S-Entertainment-Hub
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
